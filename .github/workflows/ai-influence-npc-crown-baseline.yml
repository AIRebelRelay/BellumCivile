name: AI Influence NPC Crown Baseline

on:
  push:
    branches:
      - 'feature/1.4.5-ai-influence-npc-crown'
    paths:
      - 'Tests/AiInfluenceNpcCrownBaseline.Tests.ps1'
      - 'Tests/AiInfluenceNpcCrownStage6.Tests.ps1'
      - 'Tests/AiInfluenceNpcCrownStage6.Runtime.Tests.ps1'
      - 'Tests/AiInfluenceNpcCrownStage6.Stubs.cs'
      - 'Tests/AiInfluenceNpcCrownStage7.Stubs.cs'
      - 'Tests/AiInfluenceNpcCrownStage7.Runtime.Tests.ps1'
      - 'Tests/AiInfluenceNpcCrownStage8.Runtime.Tests.ps1'
      - 'Tests/AiInfluenceNpcCrownStage8.Source.Tests.ps1'
      - 'Tests/AiInfluenceNpcCrownStage9.BuildGate.Tests.ps1'
      - 'Tests/AiInfluenceNpcCrownStage11.Inventory.Tests.ps1'
      - 'Tests/AiInfluenceNpcCrownStage16.NoticeContext.Tests.ps1'
      - 'scripts/Verify-Bellum148Build.ps1'
      - 'Behaviors/CourtNpcTreasonLifecycle.cs'
      - 'Tests/AiInfluenceNpcCrownStage7.Source.Tests.ps1'
      - 'Tests/AiInfluenceNpcCrownCompileItems.Tests.ps1'
      - 'BellumCivile.csproj'
      - 'Behaviors/CourtNpcTreasonAssignment.cs'
      - 'NpcCrownTreasonIntentRecord.cs'
      - 'Behaviors/CourtNpcTreasonIntents.cs'
      - '.github/workflows/ai-influence-npc-crown-baseline.yml'
      - 'BellumIntegration*.cs'
      - 'Behaviors/Court*'
      - 'Behaviors/IdeologyBehavior.cs'
      - 'Behaviors/ExpulsionDeliberationBehavior.cs'
      - 'CourtAgendaRecord.cs'
      - 'CourtExecutiveObjectiveSource.cs'
      - 'IntegrationSnapshots.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Baseline source contract
        shell: pwsh
        run: ./Tests/AiInfluenceNpcCrownBaseline.Tests.ps1
      - name: Existing Bellum executive scheduler regression
        shell: pwsh
        run: ./Tests/CourtExecutiveScheduler.Tests.ps1
      - name: Stage 6 ticket codec and admission regression
        shell: pwsh
        run: ./Tests/AiInfluenceNpcCrownStage6.Tests.ps1
      - name: Stage 6 isolated compiled API behavior and save roundtrip
        shell: pwsh
        run: ./Tests/AiInfluenceNpcCrownStage6.Runtime.Tests.ps1
      - name: Stage 7 Crown priority and native ownership source contract
        shell: pwsh
        run: ./Tests/AiInfluenceNpcCrownStage7.Source.Tests.ps1
      - name: Stage 7 compiled isolated agenda assignment and save roundtrip
        shell: pwsh
        run: ./Tests/AiInfluenceNpcCrownStage7.Runtime.Tests.ps1
      - name: Exclude isolated stub classes from the shipping Bellum DLL
        shell: pwsh
        run: ./Tests/AiInfluenceNpcCrownCompileItems.Tests.ps1

      - name: Stage 8 lifecycle contract and tick boundary
        shell: pwsh
        run: ./Tests/AiInfluenceNpcCrownStage8.Source.Tests.ps1
      - name: Stage 8 compiled lifecycle and tombstone replay regressions
        shell: pwsh
        run: ./Tests/AiInfluenceNpcCrownStage8.Runtime.Tests.ps1
      - name: Stage 11 persisted read-only Crown inventory and mock reload
        shell: pwsh
        run: ./Tests/AiInfluenceNpcCrownStage11.Inventory.Tests.ps1

      - name: Stage 16 exact in-flight NPC Crown native notice token
        shell: pwsh
        run: ./Tests/AiInfluenceNpcCrownStage16.NoticeContext.Tests.ps1
      - name: Stage 9 reject missing and synthetic game builds
        shell: pwsh
        run: ./Tests/AiInfluenceNpcCrownStage9.BuildGate.Tests.ps1
